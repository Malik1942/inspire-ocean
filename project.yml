name: Oryne
options:
  # Bundle ids, the App Group, and the store name keep the original
  # com.inspireocean identifiers: changing them would orphan user data,
  # placed widgets, and existing Shortcuts automations.
  bundleIdPrefix: com.inspireocean
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  # The app source folder is Oryne/. OceanWidgets/, ShareExtension/, and
  # Shared/ keep their descriptive (non-brand) names.
  Oryne:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Oryne
    dependencies:
      - target: ShareExtension
        embed: true
      - target: OceanWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    # Generate the scheme so CLI builds (-scheme Oryne) survive a regen;
    # without this only Xcode's transient user scheme exists.
    scheme:
      configVariants: []
    entitlements:
      path: Oryne/Oryne.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.inspireocean.app
        aps-environment: development
    info:
      path: Oryne/Info.plist
      properties:
        CFBundleDisplayName: Oryne
        # Version lives once in settings.base (MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION); referencing it here is what makes the
        # generated Info.plist track it, instead of xcodegen's 1.0/1 default.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Declaring the shipped localizations is what surfaces the standard
        # per-app Language control in iOS Settings (Settings › Oryne › Language).
        # Language is chosen there, not in-app; the base is English.
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleURLTypes:
          - CFBundleURLName: com.inspireocean.app
            CFBundleURLSchemes:
              - oryne
              - oryn           # legacy scheme — already-placed widgets/Shortcuts keep working
              - inspireocean   # legacy scheme — already-placed widgets/Shortcuts keep working
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          # CloudKit delivers sync changes via silent push notifications.
          - remote-notification
        NSMicrophoneUsageDescription: "Oryne uses the microphone to catch voice drifts before they disappear."
        NSSpeechRecognitionUsageDescription: "Oryne transcribes your voice captures so they can resurface and connect."
        NSPhotoLibraryUsageDescription: "Oryne lets you capture screenshots and photos as inspiration fragments."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app.share
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
        # Same iCloud container so share-sheet captures sync directly, rather
        # than waiting for the main app to pick them up on next launch.
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.inspireocean.app
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Oryne
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1

  OceanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: OceanWidgets
      - path: Oryne/DesignSystem/OceanTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app.widgets
    entitlements:
      path: OceanWidgets/OceanWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
    info:
      path: OceanWidgets/Info.plist
      properties:
        CFBundleDisplayName: Oryne
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
