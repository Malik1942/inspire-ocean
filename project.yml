name: Oryne
options:
  # Keeps Xcode's "Update to recommended settings" prompt quiet: the
  # project is generated, so the settings are what this file says.
  xcodeVersion: "27.1"
  # Bundle ids, the App Group, and the store name keep the original
  # com.inspireocean identifiers: changing them would orphan user data,
  # placed widgets, and existing Shortcuts automations.
  bundleIdPrefix: com.inspireocean
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  # The app source folder is Oryne/. OceanWidgets/, ShareExtension/, and
  # Shared/ keep their descriptive (non-brand) names.
  Oryne:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Oryne
    dependencies:
      - target: ShareExtension
        embed: true
      - target: OceanWidgets
        embed: true
      # The Apple Watch companion installs alongside the phone app.
      - target: OryneWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    # Generate the scheme so CLI builds (-scheme Oryne) survive a regen;
    # without this only Xcode's transient user scheme exists.
    scheme:
      configVariants: []
      testTargets:
        - SharedTests
    entitlements:
      path: Oryne/Oryne.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.inspireocean.app
        aps-environment: development
    info:
      path: Oryne/Info.plist
      properties:
        CFBundleDisplayName: Oryne
        # Version lives once in settings.base (MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION); referencing it here is what makes the
        # generated Info.plist track it, instead of xcodegen's 1.0/1 default.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Declaring the shipped localizations is what surfaces the standard
        # per-app Language control in iOS Settings (Settings › Oryne › Language).
        # Language is chosen there, not in-app; the base is English.
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleURLTypes:
          - CFBundleURLName: com.inspireocean.app
            CFBundleURLSchemes:
              - oryne
              - oryn           # legacy scheme — already-placed widgets/Shortcuts keep working
              - inspireocean   # legacy scheme — already-placed widgets/Shortcuts keep working
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          # CloudKit delivers sync changes via silent push notifications.
          - remote-notification
        NSMicrophoneUsageDescription: "Oryne uses the microphone to catch voice drifts before they disappear."
        NSSpeechRecognitionUsageDescription: "Oryne transcribes your voice captures so they can resurface and connect."
        NSPhotoLibraryUsageDescription: "Oryne lets you capture screenshots and photos as inspiration fragments."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Unit tests for Shared/ logic (pure, no host app — keeps `xcodebuild test`
  # runnable without booting the full Oryne app in a simulator). Runs via the
  # Oryne scheme's test action.
  SharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared
      - path: SharedTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app.sharedtests
        GENERATE_INFOPLIST_FILE: YES

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app.share
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
        # Same iCloud container so share-sheet captures sync directly, rather
        # than waiting for the main app to pick them up on next launch.
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.inspireocean.app
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Oryne
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1

  OceanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: OceanWidgets
      - path: Oryne/DesignSystem/OceanTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app.widgets
    entitlements:
      path: OceanWidgets/OceanWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
    info:
      path: OceanWidgets/Info.plist
      properties:
        CFBundleDisplayName: Oryne
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Apple Watch companion: catches a whisper from the wrist and sends it to
  # the phone (WatchConnectivity, with an iCloud inbox fallback). It records,
  # queues, and sends only; the phone transcribes and organizes. Lean on
  # purpose: it compiles Shared/Watch and the theme, never SwiftData or Node.
  OryneWatch:
    type: application
    platform: watchOS
    sources:
      - path: OryneWatch
      - path: Shared/Watch
      - path: Oryne/DesignSystem/OceanTheme.swift
    dependencies:
      - target: OryneWatchWidgets
        embed: true
    scheme:
      configVariants: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app.watchkitapp
        # App Store validation requires the watch app to ship an icon and a
        # CFBundleIconName; actool writes that key from this asset catalog.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: OryneWatch/OryneWatch.entitlements
      properties:
        # Not shared with the phone (watch containers never are). Present as
        # the signed-build proof that gates CloudKit (WatchInboxSchema.isSignedBuild).
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
        # Upload only, to the iCloud inbox zone.
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.inspireocean.app
    info:
      path: OryneWatch/Info.plist
      properties:
        CFBundleDisplayName: Oryne
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - en
          - zh-Hans
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.inspireocean.app
        # actool writes the nested CFBundleIcons for watchOS but not the
        # top-level CFBundleIconName that App Store validation (error 90713)
        # requires on the watch bundle; set it explicitly to match AppIcon.
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.inspireocean.app.watchkitapp
            CFBundleURLSchemes:
              - oryne
        # Keeps a take recording with the wrist down (spec §1).
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Oryne uses the microphone to catch a whisper from your wrist before it disappears."

  # Watch face complications and the Smart Stack: static launchers into a
  # hot mic (oryne://watch/catch). No App Group or iCloud: they show no data.
  OryneWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: OryneWatchWidgets
      - path: Shared/Watch/WatchDeepLink.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app.watchkitapp.widgets
    info:
      path: OryneWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Oryne
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - en
          - zh-Hans
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
