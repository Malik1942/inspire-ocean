name: Oryn
options:
  # Bundle ids, the App Group, and the store name keep the original
  # com.inspireocean identifiers: changing them would orphan user data,
  # placed widgets, and existing Shortcuts automations.
  bundleIdPrefix: com.inspireocean
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  # Source folders keep their historical names (InspireOcean/, OceanWidgets/)
  # so git history and the in-flight working tree stay intact.
  Oryn:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: InspireOcean
    dependencies:
      - target: ShareExtension
        embed: true
      - target: OceanWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: InspireOcean/InspireOcean.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
    info:
      path: InspireOcean/Info.plist
      properties:
        CFBundleDisplayName: Oryn
        CFBundleURLTypes:
          - CFBundleURLName: com.inspireocean.app
            CFBundleURLSchemes:
              - oryn
              - inspireocean   # legacy scheme — existing widgets/Shortcuts keep working
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Oryn uses the microphone to catch voice drifts before they disappear."
        NSSpeechRecognitionUsageDescription: "Oryn transcribes your voice captures so they can resurface and connect."
        NSPhotoLibraryUsageDescription: "Oryn lets you capture screenshots and photos as inspiration fragments."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app.share
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Oryn
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1

  OceanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: OceanWidgets
      - path: InspireOcean/DesignSystem/OceanTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app.widgets
    entitlements:
      path: OceanWidgets/OceanWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
    info:
      path: OceanWidgets/Info.plist
      properties:
        CFBundleDisplayName: Oryn
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
