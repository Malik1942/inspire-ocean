name: Oryne
options:
  # Bundle ids, the App Group, and the store name keep the original
  # com.inspireocean identifiers: changing them would orphan user data,
  # placed widgets, and existing Shortcuts automations.
  bundleIdPrefix: com.inspireocean
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  # The app source folder is Oryne/. OceanWidgets/, ShareExtension/, and
  # Shared/ keep their descriptive (non-brand) names.
  Oryne:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Oryne
    dependencies:
      - target: ShareExtension
        embed: true
      - target: OceanWidgets
        embed: true
      # Embed the watchOS companion so it installs alongside the phone app.
      - target: OryneWatch
        embed: true
      # The phone owns sync; it receives watch captures over WatchConnectivity.
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    # Generate the scheme so CLI builds (-scheme Oryne) survive a regen;
    # without this only Xcode's transient user scheme exists.
    scheme:
      configVariants: []
    entitlements:
      path: Oryne/Oryne.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.inspireocean.app
        aps-environment: development
    info:
      path: Oryne/Info.plist
      properties:
        CFBundleDisplayName: Oryne
        CFBundleURLTypes:
          - CFBundleURLName: com.inspireocean.app
            CFBundleURLSchemes:
              - oryne
              - oryn           # legacy scheme — already-placed widgets/Shortcuts keep working
              - inspireocean   # legacy scheme — already-placed widgets/Shortcuts keep working
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          # CloudKit delivers sync changes via silent push notifications.
          - remote-notification
        NSMicrophoneUsageDescription: "Oryne uses the microphone to catch voice drifts before they disappear."
        NSSpeechRecognitionUsageDescription: "Oryne transcribes your voice captures so they can resurface and connect."
        NSPhotoLibraryUsageDescription: "Oryne lets you capture screenshots and photos as inspiration fragments."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app.share
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
        # Same iCloud container so share-sheet captures sync directly, rather
        # than waiting for the main app to pick them up on next launch.
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.inspireocean.app
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Oryne
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1

  OceanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: OceanWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app.widgets
    entitlements:
      path: OceanWidgets/OceanWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
    info:
      path: OceanWidgets/Info.plist
      properties:
        CFBundleDisplayName: Oryne
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # watchOS companion: one-press wrist capture. Single-target SwiftUI watch app
  # (watchOS 9+ model — no separate WatchKit extension). It records and queues
  # only; the phone owns transcription, organization, and CloudKit sync. Kept
  # lean: it sources just the shared design tokens (+ ConnectivityKeys later),
  # not the SwiftData models or AI services. watchOS 11 floor so the shared
  # OceanTheme (MeshGradient, @Entry) compiles.
  OryneWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Shared/DesignSystem
      - path: Shared/AppGroup.swift
      - path: OryneWatch
    dependencies:
      - sdk: WatchConnectivity.framework
    # Generate the scheme so CLI builds (-scheme OryneWatch) survive a regen.
    scheme:
      configVariants: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app.watchkitapp
        # App Store validation requires the watch app to ship an icon and a
        # CFBundleIconName; actool writes that key from this asset catalog.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: OryneWatch/OryneWatch.entitlements
      properties:
        # Frozen App Group (see options header): the watch writes pending
        # captures into the same shared container the phone reads.
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
    info:
      path: OryneWatch/Info.plist
      properties:
        CFBundleDisplayName: Oryne
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.inspireocean.app
        # actool writes the nested CFBundleIcons for watchOS but not the
        # top-level CFBundleIconName that App Store validation (error 90713)
        # requires on the watch bundle; set it explicitly to match AppIcon.
        CFBundleIconName: AppIcon
        NSMicrophoneUsageDescription: "Oryne uses the microphone to catch a whisper from your wrist before it disappears."
