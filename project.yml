name: InspireOcean
options:
  bundleIdPrefix: com.inspireocean
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  InspireOcean:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: InspireOcean
    dependencies:
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: InspireOcean/InspireOcean.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
    info:
      path: InspireOcean/Info.plist
      properties:
        CFBundleDisplayName: Inspire Ocean
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Inspire Ocean uses the microphone to catch voice drifts before they disappear."
        NSSpeechRecognitionUsageDescription: "Inspire Ocean transcribes your voice captures so they can resurface and connect."
        NSPhotoLibraryUsageDescription: "Inspire Ocean lets you capture screenshots and photos as inspiration fragments."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspireocean.app.share
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inspireocean.shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Inspire Ocean
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
